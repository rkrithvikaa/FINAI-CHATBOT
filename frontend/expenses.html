<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expenses - FinAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container py-4">

    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="fa-solid fa-arrow-trend-down text-danger"></i>
                Expenses
            </h2>

            <p class="text-muted">
                Track and manage your spending
            </p>
        </div>

        <a href="dashboard.html"
           class="btn btn-outline-primary">

            <i class="fa-solid fa-arrow-left"></i>
            Dashboard

        </a>

    </div>


    <!-- ADD EXPENSE -->

    <div class="content-card mb-4">

        <h5 class="mb-3">
            Add Expense
        </h5>

        <form id="expenseForm"
              onsubmit="addExpense(event)">

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        class="form-control"
                        placeholder="Enter amount"
                        min="0"
                        required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        id="category"
                        class="form-select"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Medical">
                            Medical
                        </option>

                        <option value="Investment">
                            Investment
                        </option>

                        <option value="Others">
                            Others
                        </option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        class="form-control"
                        placeholder="What did you spend on?">

                </div>


                <div class="col-12">

                    <button
                        type="submit"
                        class="btn btn-danger">

                        <i class="fa-solid fa-plus"></i>
                        Add Expense

                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- EXPENSE HISTORY -->

    <div class="content-card">

        <div class="d-flex justify-content-between
                    align-items-center mb-3">

            <div>
                <h5 class="mb-1">
                    Expense History
                </h5>

                <p class="text-muted mb-0">
                    Your recent expenses
                </p>
            </div>

            <input
                type="text"
                id="expenseSearch"
                class="form-control"
                style="max-width:220px;"
                placeholder="Search expenses">

        </div>


        <div class="table-responsive">

            <table class="table">

                <thead>

                    <tr>

                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="expenseTable">

                    <tr>

                        <td colspan="4"
                            class="text-center text-muted">

                            No expense records yet.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>
<script src="js/expenses.js"></script>

</body>

</html>
