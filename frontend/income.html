<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Income - FinAI</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- FinAI CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <div class="container py-4">


        <!-- ========================================
             HEADER
        ========================================= -->

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    mb-4">


            <div>

                <h2 class="fw-bold">

                    <i class="fa-solid
                              fa-arrow-trend-up
                              text-success">
                    </i>

                    Income

                </h2>


                <p class="text-muted mb-0">

                    Manage your income sources

                </p>

            </div>


            <a
                href="dashboard.html"
                class="btn btn-outline-primary">

                <i class="fa-solid fa-arrow-left"></i>

                Dashboard

            </a>

        </div>



        <!-- ========================================
             ADD INCOME
        ========================================= -->

        <div class="content-card mb-4">


            <h5 class="mb-3">

                Add Income

            </h5>



            <form
                id="incomeForm"
                onsubmit="addIncome(event)">


                <div class="row g-3">


                    <!-- AMOUNT -->

                    <div class="col-md-6">

                        <label
                            for="amount"
                            class="form-label">

                            Amount

                        </label>


                        <input
                            type="number"
                            id="amount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="0"
                            step="0.01"
                            required>

                    </div>



                    <!-- SOURCE -->

                    <div class="col-md-6">

                        <label
                            for="source"
                            class="form-label">

                            Source

                        </label>


                        <input
                            type="text"
                            id="source"
                            class="form-control"
                            placeholder="Salary, Freelance, Business, etc."
                            required>

                    </div>



                    <!-- DATE -->

                    <div class="col-md-6">

                        <label
                            for="date"
                            class="form-label">

                            Date

                        </label>


                        <input
                            type="date"
                            id="date"
                            class="form-control"
                            required>

                    </div>



                    <!-- NOTES -->

                    <div class="col-md-6">

                        <label
                            for="notes"
                            class="form-label">

                            Notes

                        </label>


                        <input
                            type="text"
                            id="notes"
                            class="form-control"
                            placeholder="Optional notes">

                    </div>



                    <!-- BUTTON -->

                    <div class="col-12">


                        <button
                            type="submit"
                            class="btn btn-success">


                            <i
                                class="fa-solid fa-plus">
                            </i>


                            Add Income


                        </button>


                    </div>


                </div>


            </form>


        </div>



        <!-- ========================================
             INCOME HISTORY
        ========================================= -->

        <div class="content-card">


            <h5 class="mb-3">

                Income History

            </h5>



            <div class="table-responsive">


                <table
                    class="table table-hover">


                    <thead>


                        <tr>

                            <th>
                                Source
                            </th>


                            <th>
                                Amount
                            </th>


                            <th>
                                Date
                            </th>


                            <th>
                                Notes
                            </th>

                        </tr>


                    </thead>



                    <tbody id="incomeTable">


                        <tr>

                            <td
                                colspan="4"
                                class="text-center text-muted">

                                No income records yet.

                            </td>

                        </tr>


                    </tbody>


                </table>


            </div>


        </div>


    </div>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <!-- Authentication -->
    <script src="js/auth.js"></script>


    <!-- Income -->
    <script src="js/income.js"></script>


</body>

</html>
