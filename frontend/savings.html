<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Savings Goals - FinAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-4">

    <!-- HEADER -->

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="fa-solid fa-piggy-bank text-warning"></i>

                Savings Goals

            </h2>

            <p class="text-muted">
                Set goals and track your savings
            </p>

        </div>

        <a href="dashboard.html"
           class="btn btn-outline-primary">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </a>

    </div>


    <!-- CREATE GOAL -->

    <div class="content-card mb-4">

        <h5 class="mb-3">
            Create Savings Goal
        </h5>

        <form id="savingsForm"
              onsubmit="addSavingsGoal(event)">

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Goal Name
                    </label>

                    <input
                        type="text"
                        id="goalName"
                        class="form-control"
                        placeholder="Example: New Laptop"
                        required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Target Amount
                    </label>

                    <input
                        type="number"
                        id="targetAmount"
                        class="form-control"
                        placeholder="Enter target amount"
                        min="1"
                        required>

                </div>


                <div class="col-12">

                    <button
                        type="submit"
                        class="btn btn-warning">

                        <i class="fa-solid fa-plus"></i>

                        Create Goal

                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- SAVINGS GOALS -->

    <div>

        <h5 class="mb-3">
            My Savings Goals
        </h5>

        <div
            id="savingsList"
            class="row g-4">

            <div class="col-12">

                <div class="content-card text-center">

                    <i class="fa-solid fa-piggy-bank
                              text-muted fs-1">
                    </i>

                    <p class="text-muted mt-3 mb-0">

                        No savings goals created yet.

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>
<script src="js/savings.js"></script>

</body>

</html>
