<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot - FinAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container py-4">

        <!-- HEADER -->

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    mb-4">

            <div>

                <h2 class="fw-bold">

                    <i class="fa-solid fa-robot text-primary"></i>

                    FinAI Assistant

                </h2>

                <p class="text-muted mb-0">
                    Your personal AI finance assistant
                </p>

            </div>


            <a href="dashboard.html"
               class="btn btn-outline-primary">

                <i class="fa-solid fa-arrow-left"></i>

                Dashboard

            </a>

        </div>


        <!-- CHAT BOX -->

        <div class="content-card">

            <div
                id="chatBox"
                class="chat-box"
                style="height:500px;
                       overflow-y:auto;
                       padding:20px;">

                <!-- Welcome message -->

                <div class="message bot">

                    <div class="message-content">

                        <strong>FinAI</strong>

                        <p class="mb-0 mt-2">

                            Hello! 👋 I'm your AI finance
                            assistant.

                            <br><br>

                            You can ask me things like:

                            <br>

                            • Where am I spending the most?
                            <br>
                            • How can I save more money?
                            <br>
                            • Suggest a budget for me.

                        </p>

                    </div>

                </div>

            </div>


            <!-- INPUT -->

            <div class="d-flex gap-2 mt-3">

                <input
                    type="text"
                    id="chatInput"
                    class="form-control"
                    placeholder="Ask FinAI about your finances...">

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="sendMessage()">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>


        <!-- SUGGESTIONS -->

        <div class="content-card mt-4">

            <h5>
                Try asking
            </h5>

            <div class="d-flex
                        flex-wrap
                        gap-2
                        mt-3">

                <button
                    class="btn btn-outline-primary"
                    onclick="askSuggestion('Where am I spending the most?')">

                    Where am I spending the most?

                </button>

                <button
                    class="btn btn-outline-primary"
                    onclick="askSuggestion('How can I save more money?')">

                    How can I save more?

                </button>

                <button
                    class="btn btn-outline-primary"
                    onclick="askSuggestion('Suggest a monthly budget')">

                    Suggest a budget

                </button>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>

    <script>

        function askSuggestion(text) {

            const input =
                document.getElementById("chatInput");

            input.value = text;

            sendMessage();

        }

    </script>

</body>

</html>
